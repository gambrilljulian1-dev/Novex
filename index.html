<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novex</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-container">

    <div class="logo">
      <h1>Novex</h1>
      <p>Your school. Your work. Your progress.</p>
    </div>

    <div class="auth-card">

      <h2 id="form-title">Log in</h2>

      <input
        id="name"
        type="text"
        placeholder="Full name"
        class="signup-only"
      >

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="main-button">Log in</button>

      <p id="message"></p>

      <button id="switch-button" class="secondary-button">
        Create an account
      </button>

    </div>

  </main>

  <script type="module" src="app.js"></script>

</body>
</html>
