<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Novex Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

    <header class="topbar">
      <div>
        <h1>Novex</h1>
        <p id="welcome">Welcome!</p>
      </div>

      <button id="logout-button">Log out</button>
    </header>

    <section class="dashboard-card">

      <h2>Your Assignments</h2>

      <div id="assignments">
        <p>No assignments yet.</p>
      </div>

    </section>

    <section class="dashboard-card">

      <h2>Account</h2>

      <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
      <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
      <p><strong>Role:</strong> <span id="user-role">Loading...</span></p>

    </section>

  </main>

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const welcome = document.getElementById("welcome");
    const userName = document.getElementById("user-name");
    const userEmail = document.getElementById("user-email");
    const userRole = document.getElementById("user-role");
    const logoutButton = document.getElementById("logout-button");


    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      userEmail.textContent = user.email;

      try {

        const userDocument = await getDoc(
          doc(db, "users", user.uid)
        );

        if (userDocument.exists()) {

          const data = userDocument.data();

          userName.textContent = data.name || "Student";
          userRole.textContent = data.role || "student";

          welcome.textContent =
            `Welcome, ${data.name || "Student"}!`;

        } else {

          userName.textContent = "Student";
          userRole.textContent = "student";
          welcome.textContent = "Welcome to Novex!";

        }

      } catch (error) {

        console.error(error);

        welcome.textContent = "Welcome to Novex!";

      }

    });


    logoutButton.addEventListener("click", async () => {

      await signOut(auth);

      window.location.href = "index.html";

    });

  </script>

</body>
</html>
