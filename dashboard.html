<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novex Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #17204f 0%, transparent 35%),
        radial-gradient(circle at bottom left, #101b42 0%, transparent 30%),
        #070b18;
      color: #f5f7ff;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 110px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand p {
      color: #8992b2;
      margin-top: 4px;
      font-size: 14px;
    }

    .role-badge {
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(99, 102, 241, .16);
      border: 1px solid rgba(129, 140, 248, .25);
      color: #bfc5ff;
      font-size: 13px;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .page-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 5px;
    }

    .page-subtitle {
      color: #8992b2;
      font-size: 17px;
      margin-bottom: 26px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 14px;
      font-weight: 750;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: rgba(15, 20, 38, .86);
      border: 1px solid rgba(130, 145, 190, .17);
      border-radius: 25px;
      padding: 22px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .18);
      backdrop-filter: blur(18px);
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .muted {
      color: #8992b2;
    }

    .small {
      font-size: 14px;
    }

    .button {
      min-height: 50px;
      padding: 12px 20px;
      border-radius: 17px;
      color: white;
      background: linear-gradient(135deg, #586dff, #7547e9);
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(87, 77, 255, .22);
      transition: .18s;
    }

    .button:active {
      transform: scale(.97);
    }

    .button.secondary {
      background: rgba(115, 126, 164, .13);
      border: 1px solid rgba(150, 160, 200, .17);
      box-shadow: none;
    }

    .button.danger {
      background: rgba(220, 55, 70, .15);
      border: 1px solid rgba(255, 80, 95, .22);
      color: #ff9ba5;
      box-shadow: none;
    }

    .button.small-button {
      min-height: 43px;
      padding: 9px 15px;
      border-radius: 14px;
      font-size: 14px;
    }

    .button.full {
      width: 100%;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: rgba(4, 8, 20, .7);
      border: 1px solid rgba(130, 145, 190, .2);
      border-radius: 15px;
      color: #fff;
      padding: 14px 15px;
      outline: none;
      margin-top: 7px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #6877ff;
      box-shadow: 0 0 0 3px rgba(104, 119, 255, .12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      color: #c6cbe0;
      font-size: 14px;
      font-weight: 650;
      margin-top: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .question-builder {
      margin-top: 20px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(4, 8, 20, .42);
      border: 1px solid rgba(130, 145, 190, .13);
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .choice-row input {
      margin-top: 0;
    }

    .correct-select {
      margin-top: 8px;
    }

    .student-search {
      display: flex;
      gap: 9px;
      align-items: stretch;
    }

    .student-search input {
      margin-top: 0;
    }

    .selected-student {
      margin-top: 10px;
      padding: 13px;
      border-radius: 15px;
      background: rgba(70, 90, 180, .12);
      border: 1px solid rgba(100, 120, 220, .18);
      color: #cbd1ff;
    }

    .user-result {
      margin-top: 10px;
      padding: 14px;
      border-radius: 15px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .assignment-card {
      position: relative;
    }

    .assignment-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .assignment-title {
      font-size: 21px;
      font-weight: 750;
    }

    .assignment-meta {
      margin-top: 7px;
      color: #8992b2;
      line-height: 1.55;
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 15px;
    }

    .status.pending {
      background: rgba(242, 180, 58, .12);
      color: #f6d57b;
    }

    .status.graded {
      background: rgba(54, 211, 153, .12);
      color: #6ee7b7;
    }

    .status.ungraded {
      background: rgba(242, 180, 58, .12);
      color: #f6d57b;
    }

    .status.correct {
      background: rgba(54, 211, 153, .12);
      color: #6ee7b7;
    }

    .status.incorrect {
      background: rgba(255, 90, 100, .12);
      color: #ff9ba5;
    }

    .assignment-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .grade-number {
      font-size: 31px;
      font-weight: 800;
      margin-top: 8px;
    }

    .letter {
      color: #aeb6ff;
      font-weight: 800;
    }

    .category {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #8992b2;
    }

    .empty strong {
      display: block;
      color: #dce0f0;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .question-display {
      padding: 17px;
      border-radius: 19px;
      background: rgba(4, 8, 20, .42);
      border: 1px solid rgba(130, 145, 190, .13);
      margin-top: 14px;
    }

    .question-display h4 {
      font-size: 17px;
      line-height: 1.45;
      margin-bottom: 13px;
    }

    .answer-option {
      display: block;
      padding: 12px;
      border-radius: 13px;
      margin-top: 8px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
    }

    .answer-option input {
      width: auto;
      margin: 0 8px 0 0;
    }

    .student-answer {
      margin-top: 10px;
      padding: 13px;
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      color: #dce1f2;
      white-space: pre-wrap;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .grade-summary {
      padding: 18px;
      border-radius: 19px;
      background: rgba(80, 90, 220, .09);
      border: 1px solid rgba(110, 120, 240, .17);
      margin-bottom: 17px;
    }

    .grade-summary-main {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .percentage-big {
      font-size: 38px;
      font-weight: 850;
    }

    .letter-big {
      font-size: 30px;
      font-weight: 850;
      color: #aeb6ff;
    }

    .note-box {
      margin-top: 12px;
      padding: 13px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      color: #bbc1d7;
      white-space: pre-wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      backdrop-filter: blur(7px);
    }

    .modal {
      width: 100%;
      max-width: 760px;
      max-height: 94vh;
      overflow-y: auto;
      background: #0d1224;
      border: 1px solid rgba(140, 150, 200, .2);
      border-radius: 27px;
      padding: 22px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 20px;
    }

    .grade-controls {
      padding: 17px;
      margin-top: 15px;
      border-radius: 19px;
      background: rgba(4,8,20,.4);
      border: 1px solid rgba(130,145,190,.13);
    }

    .result-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .result-button {
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: #c7cce0;
      border: 1px solid rgba(255,255,255,.08);
    }

    .result-button.selected-correct {
      background: rgba(54,211,153,.15);
      color: #6ee7b7;
      border-color: rgba(54,211,153,.3);
    }

    .result-button.selected-wrong {
      background: rgba(255,90,100,.15);
      color: #ff9ba5;
      border-color: rgba(255,90,100,.3);
    }

    .result-button.selected-none {
      background: rgba(255,255,255,.1);
      color: white;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 86px;
      background: rgba(7, 11, 24, .94);
      border-top: 1px solid rgba(140, 150, 190, .13);
      backdrop-filter: blur(20px);
      z-index: 50;
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 850px;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
    }

    .nav-button {
      flex: 1;
      max-width: 150px;
      background: transparent;
      color: #8992b2;
      font-size: 13px;
      padding: 8px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    .nav-button.active {
      color: #e8eaff;
    }

    .nav-button span {
      padding: 11px 12px;
      border-radius: 17px;
    }

    .nav-button.active span {
      background: rgba(102, 89, 255, .17);
      border: 1px solid rgba(109, 115, 255, .25);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      padding: 13px 17px;
      border-radius: 14px;
      background: #151b31;
      border: 1px solid rgba(255,255,255,.12);
      color: white;
      z-index: 200;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
      max-width: 90%;
      text-align: center;
    }

    @media (max-width: 700px) {
      .grid,
      .form-row {
        grid-template-columns: 1fr;
      }

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .page-title {
        font-size: 31px;
      }

      .assignment-top {
        flex-direction: column;
      }

      .choice-row {
        grid-template-columns: 1fr;
      }

      .student-search {
        flex-direction: column;
      }

      .grade-summary-main {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .modal-backdrop {
        padding: 0;
      }

      .modal {
        border-radius: 25px 25px 0 0;
        max-height: 96vh;
      }
    }
  </style>
</head>

<body>

  <div id="app" class="page">

    <div class="topbar">
      <div class="brand">
        <h1>Novex</h1>
        <p id="welcome-text">Your school. Your work. Your progress.</p>
      </div>

      <div id="role-badge" class="role-badge">loading</div>
    </div>

    <div id="page-content"></div>

  </div>

  <nav class="bottom-nav">
    <div class="nav-inner" id="nav-inner"></div>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      setDoc,
      updateDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    // ============================================================
    // GLOBAL STATE
    // ============================================================

    let currentUser = null;
    let currentProfile = null;
    let currentRole = "student";
    let currentPage = "home";

    let selectedStudent = null;
    let assignmentQuestions = [];

    let currentGradingSubmission = null;
    let currentGradingAssignment = null;

    // ============================================================
    // BASIC HELPERS
    // ============================================================

    const pageContent = document.getElementById("page-content");
    const navInner = document.getElementById("nav-inner");
    const roleBadge = document.getElementById("role-badge");
    const welcomeText = document.getElementById("welcome-text");
    const modalRoot = document.getElementById("modal-root");
    const toastRoot = document.getElementById("toast-root");

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(text) {
      toastRoot.innerHTML = `
        <div class="toast">
          ${escapeHTML(text)}
        </div>
      `;

      setTimeout(() => {
        toastRoot.innerHTML = "";
      }, 3000);
    }

    function openModal(html) {
      modalRoot.innerHTML = `
        <div class="modal-backdrop" id="modal-backdrop">
          <div class="modal">
            ${html}
          </div>
        </div>
      `;

      document
        .getElementById("modal-backdrop")
        .addEventListener("click", event => {
          if (event.target.id === "modal-backdrop") {
            closeModal();
          }
        });
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      currentGradingSubmission = null;
      currentGradingAssignment = null;
    }

    function formatDate(timestamp) {
      if (!timestamp) return "Unknown date";

      try {
        const date = timestamp.toDate
          ? timestamp.toDate()
          : new Date(timestamp);

        return date.toLocaleString([], {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      } catch {
        return "Unknown date";
      }
    }

    function formatShortDate(timestamp) {
      if (!timestamp) return "Unknown";

      try {
        const date = timestamp.toDate
          ? timestamp.toDate()
          : new Date(timestamp);

        return date.toLocaleDateString([], {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
      } catch {
        return "Unknown";
      }
    }

    function isStaff() {
      return (
        currentRole === "teacher" ||
        currentRole === "admin" ||
        currentRole === "owner"
      );
    }

    function canCreateAssignments() {
      return (
        currentRole === "teacher" ||
        currentRole === "owner"
      );
    }

    function isOwner() {
      return (
        currentUser &&
        currentUser.email &&
        currentUser.email.toLowerCase() ===
          "gambrilljulian452@gmail.com"
      );
    }

    // ============================================================
    // AUTH
    // ============================================================

    onAuthStateChanged(auth, async user => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;

      try {

        const profileSnap = await getDoc(
          doc(db, "users", user.uid)
        );

        if (profileSnap.exists()) {
          currentProfile = profileSnap.data();
          currentRole = currentProfile.role || "student";
        } else {
          currentProfile = {
            name: user.email?.split("@")[0] || "Student",
            email: user.email || "",
            role: "student"
          };

          currentRole = "student";
        }

        roleBadge.textContent = currentRole;

        welcomeText.textContent =
          `Welcome back, ${currentProfile.name || "there"}`;

        buildNavigation();
        renderPage();

      } catch (error) {
        console.error(error);

        pageContent.innerHTML = `
          <div class="card">
            <h3>Something went wrong</h3>
            <p class="muted">
              We couldn't load your Novex account.
            </p>
          </div>
        `;
      }

    });

    // ============================================================
    // NAVIGATION
    // ============================================================

    function buildNavigation() {

      let items = [];

      if (currentRole === "student") {

        items = [
          ["home", "Home"],
          ["unfinished", "Unfinished Assignments"],
          ["gradebook", "Grade Book"],
          ["courses", "Courses"],
          ["account", "Account"]
        ];

      } else {

        items = [
          ["home", "Home"],
          [
            currentRole === "owner"
              ? "allassignments"
              : "sentassignments",
            currentRole === "owner"
              ? "All Assignments"
              : "Sent Assignments"
          ],
          ["gradebook", "Grade Book"],
          ["courses", "Courses"],
          ["account", "Account"]
        ];

      }

      navInner.innerHTML = items.map(item => {

        const [id, label] = item;

        return `
          <button
            class="nav-button ${currentPage === id ? "active" : ""}"
            data-nav="${id}"
          >
            <span>${escapeHTML(label)}</span>
          </button>
        `;

      }).join("");

      navInner.querySelectorAll("[data-nav]").forEach(button => {

        button.addEventListener("click", () => {

          currentPage = button.dataset.nav;

          buildNavigation();
          renderPage();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        });

      });

    }

    function renderPage() {

      if (currentPage === "home") {
        renderHome();
        return;
      }

      if (currentPage === "unfinished") {
        renderUnfinishedAssignments();
        return;
      }

      if (
        currentPage === "sentassignments" ||
        currentPage === "allassignments"
      ) {
        renderSentAssignments();
        return;
      }

      if (currentPage === "gradebook") {
        if (currentRole === "student") {
          renderStudentGradebook();
        } else {
          renderStaffGradebook();
        }

        return;
      }

      if (currentPage === "courses") {
        renderCourses();
        return;
      }

      if (currentPage === "account") {
        renderAccount();
        return;
      }

    }

    // ============================================================
    // HOME
    // ============================================================

    async function renderHome() {

      pageContent.innerHTML = `
        <h2 class="page-title">Home</h2>
        <p class="page-subtitle">
          ${isStaff()
            ? "Manage your Novex classroom."
            : "Stay on top of your school work."}
        </p>

        <div id="home-content">
          <div class="card">
            <p class="muted">Loading...</p>
          </div>
        </div>
      `;

      const home = document.getElementById("home-content");

      if (currentRole === "student") {

        let assignments = [];

        try {
          const snap = await getDocs(
            query(
              collection(db, "assignments"),
              where(
                "assignedTo",
                "array-contains",
                currentUser.uid
              )
            )
          );

          assignments = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

        } catch (error) {
          console.error(error);
        }

        const unfinished = assignments.filter(a => {
          return a.status !== "completed";
        });

        home.innerHTML = `
          <div class="grid">

            <div class="card">
              <h3>Assignments</h3>
              <div class="grade-number">
                ${assignments.length}
              </div>
              <p class="muted small">
                assignments received
              </p>
            </div>

            <div class="card">
              <h3>Unfinished</h3>
              <div class="grade-number">
                ${unfinished.length}
              </div>
              <p class="muted small">
                assignments waiting for you
              </p>
            </div>

          </div>

          <div class="card">
            <h3>Quick access</h3>
            <p class="muted">
              Your assignments, grades, courses, and account
              are available below.
            </p>

            <div class="assignment-actions">
              <button class="button" id="home-unfinished">
                View Assignments
              </button>

              <button class="button secondary" id="home-grades">
                Grade Book
              </button>
            </div>
          </div>
        `;

        document
          .getElementById("home-unfinished")
          .addEventListener("click", () => {
            currentPage = "unfinished";
            buildNavigation();
            renderPage();
          });

        document
          .getElementById("home-grades")
          .addEventListener("click", () => {
            currentPage = "gradebook";
            buildNavigation();
            renderPage();
          });

        return;
      }

      // STAFF HOME

      let cards = `
        <div class="grid">

          ${
            canCreateAssignments()
              ? `
                <div class="card">
                  <h3>Create Assignment</h3>
                  <p class="muted">
                    Create and send a quiz to a student.
                  </p>

                  <div class="assignment-actions">
                    <button

    async function searchUsers() {

      const input =
        document.getElementById(
          "owner-search-email"
        );

      const results =
        document.getElementById(
          "owner-search-results"
        );

      const email =
        input.value.trim().toLowerCase();

        results.innerHTML = `
          <p class="muted small" style="margin-top:12px;">
            Enter an email address.
          </p>
        `;

        return;
      }

      results.innerHTML = `
        <p class="muted small" style="margin-top:12px;">
          Searching...
        </p>
      `;

      try {

        let snapshots = [];

        const exactQuery = await getDocs(
          query(
            collection(db, "users"),
            where("email", "==", email)
          )
        );

        snapshots = exactQuery.docs;

        if (snapshots.length === 0) {

          const allUsers =
            await getDocs(
              collection(db, "users")
            );

          snapshots =
            allUsers.docs.filter(d => {

              const data = d.data();

              return (
                (data.email || "")
                  .toLowerCase() === email
              );

            });

        }

        if (snapshots.length === 0) {

          results.innerHTML = `
            <div class="user-result">
              <p>No user found.</p>
            </div>
          `;

          return;
        }

        results.innerHTML =
          snapshots.map(d => {

            const data = d.data();

            return `
              <div class="user-result">

                <strong>
                  ${escapeHTML(
                    data.name || "Unnamed user"
                  )}
                </strong>

                <p class="muted small">
                  ${escapeHTML(
                    data.email || ""
                  )}
                </p>

                <p class="muted small">

                      data.role || "student"

                  <button
                    class="button small-button"
                    data-role-user="${d.id}"

    async function findStudentForAssignment() {

      const email =
        document
          .getElementById("student-email")
          .value
          .trim()
          .toLowerCase();

      const result =
        document.getElementById("student-result");

      if (!email) {

        result.innerHTML = `
          <p class="muted small">
            Enter a student email.
          </p>
        `;

        return;
      }

      result.innerHTML = `
        <p class="muted small">
          Searching...
        </p>
      `;

      try {

        let found = null;

        const exact =
          await getDocs(
            query(
              collection(db, "users"),
              where("email", "==", email)
            )
          );

        if (!exact.empty) {

          found = {
            uid: exact.docs[0].id,
            ...exact.docs[0].data()
          };

        } else {

          const users =
            await getDocs(
              collection(db, "users")
            );

          for (const d of users.docs) {

            const data = d.data();

            if (
              (data.email || "")
                .toLowerCase() === email
            ) {

              found = {
                uid: d.id,
                ...data
              };

              break;

            }

          }

        }

        if (!found) {

          selectedStudent = null;

          result.innerHTML = `
            <div class="user-result">
              Student not found.
            </div>
          `;

          return;
        }

        if (found.role !== "student") {

          selectedStudent = null;

          result.innerHTML = `
            <div class="user-result">
              That account is not a student.
            </div>
          `;

          return;
        }

        selectedStudent = found;

        result.innerHTML = `
          <div class="selected-student">
            <strong>
              ${escapeHTML(
                found.name || "Student"
              )}
            </strong>

            <div class="small">
              ${escapeHTML(found.email)}
            </div>

            <div class="small">
              Student account verified.
            </div>
          </div>
        `;

      } catch (error) {

        console.error(error);

        result.innerHTML = `
          <p class="muted">
            Search failed.
          </p>
        `;

      }

    }

    function renderQuestionBuilders() {

      const container =
        document.getElementById(
          "question-builders"
        );

      if (!container) return;

      container.innerHTML =
        assignmentQuestions.map(
          (question, index) => {

            return `
              <div
                class="question-builder"
                data-question="${index}"
              >

                <div class="question-header">

                  <strong>
                    Question ${index + 1}
                  </strong>

                  ${
                    assignmentQuestions.length > 1
                      ? `
                        <button
                          class="button danger small-button"
                          data-remove-question="${index}"
                        >
                          Remove
                        </button>
                      `
                      : ""
                  }

                </div>

                <label>
                  Question Type

                  <select
                    data-question-type="${index}"
                  >
                    <option
                      value="math"
                      ${question.type === "math" ? "selected" : ""}
                    >
                      Math
                    </option>

                    <option
                      value="written"
                      ${question.type === "written" ? "selected" : ""}
                    >
                      Written Response
                    </option>

                    <option
                      value="truefalse"
                      ${question.type === "truefalse" ? "selected" : ""}
                    >
                      True or False
                    </option>
                  </select>
                </label>

                <label>
                  Question

                  <textarea
                    data-question-text="${index}"
                    placeholder="Enter the question"
                  >${escapeHTML(
                    question.question
                  )}</textarea>

                </label>

                ${
                  question.type === "math"
                    ? `
                      <label>
                        Answer Choices
                      </label>

                      <div class="choice-row">

                        <input
                          data-choice="${index}-A"
                          type="text"
                          placeholder="A"
                          value="${escapeHTML(
                            question.choices[0] || ""
                          )}"
                        >

                        <input
                          data-choice="${index}-B"
                          type="text"
                          placeholder="B"
                          value="${escapeHTML(
                            question.choices[1] || ""
                          )}"
                        >

                        <input
                          data-choice="${index}-C"
                          type="text"
                          placeholder="C"
                          value="${escapeHTML(
                            question.choices[2] || ""
                          )}"
                        >

                      </div>

                      <label>
                        Correct Choice

                        <select
                          class="correct-select"
                          data-correct-choice="${index}"
                        >

                          <option
                            value="A"
                            ${question.correctChoice === "A" ? "selected" : ""}
                          >
                            A
                          </option>

                          <option
                            value="B"
                            ${question.correctChoice === "B" ? "selected" : ""}
                          >
                            B
                          </option>

                          <option
                            value="C"
                            ${question.correctChoice === "C" ? "selected" : ""}
                          >
                            C
                          </option>

                        </select>
                      </label>
                    `
                    : ""
                }

                ${
                  question.type === "truefalse"
                    ? `
                      <label>
                        Correct Answer

                        <select
                          data-truefalse-correct="${index}"
                        >

                          <option
                            value="true"
                            ${question.correctChoice === "true" ? "selected" : ""}
                          >
                            True
                          </option>

                          <option
                            value="false"
                            ${question.correctChoice === "false" ? "selected" : ""}
                          >
                            False
                          </option>

                        </select>
                      </label>
                    `
                    : ""
                }

              </div>
            `;

          }
        ).join("");

      container
        .querySelectorAll("[data-question-type]")
        .forEach(select => {

          select.addEventListener(
            "change",
            event => {

              const index =
                Number(
                  event.target.dataset.questionType
                );

              assignmentQuestions[index].type =
                event.target.value;

              if (
                event.target.value === "math"
              ) {

                assignmentQuestions[index].choices =
                  ["", "", ""];

                assignmentQuestions[index]
                  .correctChoice = "A";

              } else if (
                event.target.value === "truefalse"
              ) {

                assignmentQuestions[index]
                  .correctChoice = "true";

              } else {

                assignmentQuestions[index]
                  .correctChoice = "";

              }

              renderQuestionBuilders();

            }
          );

        });

      container
        .querySelectorAll("[data-question-text]")
        .forEach(input => {

          input.addEventListener(
            "input",
            event => {

              const index =
                Number(
                  event.target.dataset.questionText
                );

              assignmentQuestions[index]
                .question =
                  event.target.value;

            }
          );

        });

      container
        .querySelectorAll("[data-choice]")
        .forEach(input => {

          input.addEventListener(
            "input",
            event => {

              const parts =
                event.target.dataset.choice
                  .split("-");

              const index =
                Number(parts[0]);

              const choice =
                parts[1];

              const choiceIndex =
                choice === "A"
                  ? 0
                  : choice === "B"
                    ? 1
                    : 2;

              assignmentQuestions[index]
                .choices[choiceIndex] =
                  event.target.value;

            }
          );

        });

      container
        .querySelectorAll("[data-correct-choice]")
        .forEach(select => {

          select.addEventListener(
            "change",
            event => {

              const index =
                Number(
                  event.target.dataset.correctChoice
                );

              assignmentQuestions[index]
                .correctChoice =
                  event.target.value;

            }
          );

        });

      container
        .querySelectorAll("[data-truefalse-correct]")
        .forEach(select => {

          select.addEventListener(
            "change",
            event => {

              const index =
                Number(
                  event.target.dataset.truefalseCorrect
                );

              assignmentQuestions[index]
                .correctChoice =
                  event.target.value;

            }
          );

        });

      container
        .querySelectorAll("[data-remove-question]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const index =
                Number(
                  button.dataset.removeQuestion
                );

              assignmentQuestions.splice(
                index,
                1
              );

              renderQuestionBuilders();

            }
          );

        });

    }

    async function createAssignment() {

      if (!canCreateAssignments()) {
        showToast(
          "You don't have permission to create assignments."
        );

        return;
      }

      const title =
        document
          .getElementById("assignment-title")
          .value
          .trim();

      const courseName =
        document
          .getElementById("assignment-course")
          .value
          .trim();

      const dueDate =
        document
          .getElementById("assignment-due")
          .value;

      if (!title) {
        showToast("Enter an assignment title.");
        return;
      }

      if (!courseName) {
        showToast("Enter a course.");
        return;
      }

      if (!dueDate) {
        showToast("Choose a due date.");
        return;
      }

      if (!selectedStudent) {
        showToast("Search for a student first.");
        return;
      }

      if (
        assignmentQuestions.length < 1 ||
        assignmentQuestions.length > 5
      ) {

        showToast(
          "Assignments must have 1–5 questions."
        );

        return;
      }

      for (
        let i = 0;
        i < assignmentQuestions.length;
        i++
      ) {

        const q =
          assignmentQuestions[i];

        if (!q.question.trim()) {

          showToast(
            `Question ${i + 1} needs text.`
          );

          return;
        }

        if (q.type === "math") {

          if (
            q.choices.some(
              choice => !choice.trim()
            )
          ) {

            showToast(
              `Question ${i + 1} needs all 3 choices.`
            );

            return;
          }

        }

      }

      try {

        const cleanQuestions =
          assignmentQuestions.map(q => {

            const clean = {
              type: q.type,
              question: q.question.trim()
            };

            if (q.type === "math") {

              clean.choices =
                q.choices.map(
                  choice => choice.trim()
                );

              clean.correctChoice =
                q.correctChoice;

            }

            if (q.type === "truefalse") {

              clean.correctChoice =
                q.correctChoice;

            }

            return clean;

          });

        const answerKey =
          cleanQuestions.map(q => ({
            type: q.type,
            correctChoice:
              q.correctChoice || null
          }));

        const assignmentRef =
          await addDoc(
            collection(db, "assignments"),
            {
              title,
              courseName,

              assignedTo: [
                selectedStudent.uid
              ],

              assignedEmail:
                selectedStudent.email,

              assignedName:
                selectedStudent.name || "",

              teacherId:
                currentUser.uid,

              teacherEmail:
                currentUser.email,

              questions:
                cleanQuestions,

              dueDate,

              createdAt:
                serverTimestamp(),

              status: "assigned"
            }
          );

        await setDoc(
          doc(
            db,
            "answerKeys",
            assignmentRef.id
          ),
          {
            assignmentId:
              assignmentRef.id,

            teacherId:
              currentUser.uid,

            questions:
              answerKey,

            createdAt:
              serverTimestamp()
          }
        );

        closeModal();

        showToast(
          "Assignment sent successfully."
        );

        renderPage();

      } catch (error) {

        console.error(error);

        showToast(
          "Unable to create the assignment."
        );

      }

    }

    async function openStudentQuiz(assignmentId) {

      try {

        const assignmentSnap =
          await getDoc(
            doc(
              db,
              "assignments",
              assignmentId
            )
          );

        if (!assignmentSnap.exists()) {
          showToast("Assignment not found.");
          return;
        }

        const assignment =
          assignmentSnap.data();

        if (
          !assignment.assignedTo ||
          !assignment.assignedTo.includes(
            currentUser.uid
          )
        ) {

          showToast(
            "This assignment is not assigned to you."
          );

          return;
        }

        const existing =
          await getDocs(
            query(
              collection(db, "submissions"),
              where(
                "studentId",
                "==",
                currentUser.uid
              )
            )
          );

        const alreadySubmitted =
          existing.docs.some(
            d =>
              d.data().assignmentId ===
              assignmentId
          );

        if (alreadySubmitted) {

          showToast(
            "You already submitted this assignment."
          );

          return;
        }

        openModal(`
          <div class="modal-header">

            <div>
              <h2>
                ${escapeHTML(
                  assignment.title
                )}
              </h2>

              <p class="muted small">
                ${escapeHTML(

    async function submitStudentQuiz(
      assignmentId,
      assignment
    ) {

      const answers = [];

      for (
        let i = 0;
        i < assignment.questions.length;
        i++
      ) {

        const q =
          assignment.questions[i];

        let answer = "";

        if (q.type === "written") {

          answer =
            document
              .getElementById(
                `written-${i}`
              )
              ?.value
              .trim() || "";

        } else {

          const selected =
            document.querySelector(
              `input[name="question-${i}"]:checked`
            );

          answer =
            selected
              ? selected.value
              : "";

        }

        answers.push(answer);

      }

      try {

        await addDoc(
          collection(db, "submissions"),
          {
            assignmentId,

            teacherId:
              assignment.teacherId,

            studentId:
              currentUser.uid,

            studentEmail:
              currentUser.email,

            studentName:
              currentProfile.name || "",

            answers,

            submittedAt:
              serverTimestamp(),

            graded: false,

            grade: null,

            percentage: null,

            letterGrade: "",

            teacherNote: "",

            questionResults: []
          }
        );

        closeModal();

        showToast(
          "Assignment submitted."
        );

        currentPage = "unfinished";
        buildNavigation();
        renderPage();

      } catch (error) {

        console.error(error);

        showToast(
          "Unable to submit assignment."
        );

      }

    }

    async function openSubmissionReview(
      submissionId
    ) {

      try {

        const submissionSnap =
          await getDoc(
            doc(
              db,
              "submissions",
              submissionId
            )
          );

        if (!submissionSnap.exists()) {

          showToast(
            "Submission not found."
          );

          return;
        }

        const submission = {
          id: submissionSnap.id,
          ...submissionSnap.data()
        };

        if (
          currentRole === "teacher" &&
          submission.teacherId !==
            currentUser.uid
        ) {

          showToast(
            "You cannot grade this submission."
          );

          return;
        }

        const assignmentSnap =
          await getDoc(
            doc(
              db,
              "assignments",
              submission.assignmentId
            )
          );

        if (!assignmentSnap.exists()) {

          showToast(
            "Assignment not found."
          );

          return;
        }

        const assignment =
          assignmentSnap.data();

        currentGradingSubmission =
          submission;

        currentGradingAssignment =
          assignment;

        const existingResults =
          submission.questionResults || [];

        openModal(`
          <div class="modal-header">

            <div>
              <h2>
                Grade Submission
              </h2>

              <p class="muted small">
                ${escapeHTML(
                  submission.studentName ||
                  submission.studentEmail ||
                  "Student"
                )}
                —
                ${escapeHTML(
                  assignment.title || ""
                )}
              </p>
            </div>

            <button
              class="close-button"
              id="close-grading"
            >
              ×
            </button>

          </div>

          <div id="grading-questions">

            ${
              (assignment.questions || [])
                .map((q, index) => {

                  const result =
                    existingResults[index] || {};

                  const studentAnswer =
                    submission.answers?.[index] || "";

                  return `
                    <div
                      class="question-display"
                      data-grading-question="${index}"
                    >

                      <h4>
                        ${index + 1}.
                        ${escapeHTML(
                          q.question
                        )}
                      </h4>

                      <p class="muted small">
                        Student answer:
                      </p>

                      <div class="student-answer">
                        ${
                          studentAnswer
                            ? escapeHTML(
                                studentAnswer
                              )
                            : "No answer"
                        }
                      </div>

                      ${
                        q.type === "math"
                          ? `
                            <p
                              class="muted small"
                              style="margin-top:12px;"
                            >
                              Choices:
                              A =
                              ${escapeHTML(
                                q.choices?.[0] || ""
                              )}
                              <br>
                              B =
                              ${escapeHTML(
                                q.choices?.[1] || ""
                              )}
                              <br>
                              C =
                              ${escapeHTML(
                                q.choices?.[2] || ""
                              )}
                            </p>
                          `
                          : ""
                      }

                      <div class="grade-controls">

                        <strong>
                          Result
                        </strong>

                        <div class="result-buttons">

                          <button
                            type="button"
                            class="result-button ${
                              result.correct === true
                                ? "selected-correct"
                                : ""
                            }"
                            data-result="${index}"
                            data-value="correct"
                          >
                            Correct
                          </button>

                          <button
                            type="button"
                            class="result-button ${
                              result.correct === false
                                ? "selected-wrong"
                                : ""
                            }"
                            data-result="${index}"
                            data-value="incorrect"
                          >
                            Incorrect
                          </button>

                          <button
                            type="button"
                            class="result-button ${
                              result.correct === null ||
                              result.correct === undefined
                                ? "selected-none"
                                : ""
                            }"
                            data-result="${index}"
                            data-value="none"
                          >
                            Not graded
                          </button>

                        </div>

                        <label>
                          Teacher Note

                          <textarea
                            data-question-note="${index}"
                            placeholder="Optional feedback for the student..."
                          >${escapeHTML(
                            result.note || ""
                          )}</textarea>

                        </label>

                      </div>

                    </div>
                  `;

                }).join("")
            }

          </div>

          <div class="grade-controls">

            <h3>
              Final Grade
            </h3>

            <label>
              Percentage

              <input
                id="percentage-input"
                type="number"
                min="0"
                max="100"
                step="0.01"
                placeholder="Example: 87"
                value="${
                  submission.percentage ??
                  ""
                }"
              >
            </label>

            <label>
              Letter Grade

              <input
                id="letter-grade-input"
                type="text"
                maxlength="5"
                placeholder="Example: B+"
                value="${escapeHTML(
                  submission.letterGrade || ""
                )}"
              >
            </label>

            <label>
              Teacher Note

              <textarea
                id="overall-teacher-note"
                placeholder="Optional overall feedback..."
              >${escapeHTML(
                submission.teacherNote || ""
              )}</textarea>
            </label>

            <button
              class="button full"
              id="save-grade"
              style="margin-top:17px;"
            >
              Save Grade
            </button>

          </div>
        `);

        document
          .getElementById("close-grading")
          .addEventListener(
            "click",
            closeModal
          );

        document
          .querySelectorAll(
            "[data-result]"
          )
          .forEach(button => {

            button.addEventListener(
              "click",
              () => {

                const index =
                  Number(
                    button.dataset.result
                  );

                document
                  .querySelectorAll(
                    `[data-result="${index}"]`
                  )
                  .forEach(other => {

                    other.classList.remove(
                      "selected-correct",
                      "selected-wrong",
                      "selected-none"
                    );

                  });

                if (
                  button.dataset.value ===
                  "correct"
                ) {

                  button.classList.add(
                    "selected-correct"
                  );

                } else if (
                  button.dataset.value ===
                  "incorrect"
                ) {

                  button.classList.add(
                    "selected-wrong"
                  );

                } else {

                  button.classList.add(
                    "selected-none"
                  );

                }

              }
            );

          });

        document
          .getElementById("save-grade")
          .addEventListener(
            "click",
            saveSubmissionGrade
          );

      } catch (error) {

        console.error(error);

        showToast(
          "Unable to open grading screen."
        );

      }

    }

    // ============================================================
    // SAVE STAFF GRADE
    // ============================================================

    async function saveSubmissionGrade() {

      if (
        !currentGradingSubmission ||
        !currentGradingAssignment
      ) {

        showToast(
          "No submission selected."
        );

        return;
      }

      const percentageInput =
        document.getElementById(
          "percentage-input"
        );

      const letterGradeInput =
        document.getElementById(
          "letter-grade-input"
        );

      const teacherNoteInput =
        document.getElementById(
          "overall-teacher-note"
        );

      const percentageValue =
        percentageInput.value.trim();

      if (percentageValue === "") {

        showToast(
          "Enter a percentage."
        );

        return;
      }

      const numericPercentage =
        Number(percentageValue);

      if (
        Number.isNaN(numericPercentage) ||
        numericPercentage < 0 ||
        numericPercentage > 100
      ) {

        showToast(
          "Percentage must be between 0 and 100."
        );

        return;
      }

      const letterGrade =
        letterGradeInput.value
          .trim()
          .toUpperCase();

      const questionResults = [];

      for (
        let i = 0;
        i <
        currentGradingAssignment.questions.length;
        i++
      ) {

        const selected =
          document.querySelector(
            `[data-result="${i}"].selected-correct`
          );

        const selectedWrong =
          document.querySelector(
            `[data-result="${i}"].selected-wrong`
          );

        let correct = null;

        if (selected) {
          correct = true;
        } else if (selectedWrong) {
          correct = false;
        }

        const note =
          document
            .querySelector(
              `[data-question-note="${i}"]`
            )
            ?.value
            .trim() || "";

        questionResults.push({
          correct,
          note
        });

      }

      try {

        await updateDoc(
          doc(
            db,
            "submissions",
            currentGradingSubmission.id
          ),
          {
            percentage:
              numericPercentage,

            grade:
              `${numericPercentage}%`,

            letterGrade,

            questionResults,

            teacherNote:
              teacherNoteInput.value.trim(),

            graded:
              true,

            gradedAt:
              serverTimestamp()
          }
        );

        closeModal();

        showToast(
          "Grade saved successfully."
        );

        renderPage();

      } catch (error) {

        console.error(error);

        showToast(
          "Unable to save the grade."
        );

      }

    }

              <strong>
                No grades yet
              </strong>

              Your graded assignments will
              appear here.

            </div>
          `;

          return;
        }

        const assignmentsSnap =
          await getDocs(
            collection(
              db,
              "assignments"
            )
          );

        const assignments = {};

        assignmentsSnap.docs.forEach(d => {

          assignments[d.id] = {
            id: d.id,
            ...d.data()
          };

        });

        const categories = {
          Math: [],
          "Written Responses": [],
          "True / False": []
        };

        for (const submission of submissions) {

          const assignment =
            assignments[
              submission.assignmentId
            ];

          if (!assignment) continue;

          const questions =
            assignment.questions || [];

          const types =
            questions.map(
              q => q.type
            );

          let category =
            "Math";

          if (
            types.includes("written")
          ) {

            category =
              "Written Responses";

          } else if (
            types.includes("truefalse")
          ) {

            category =
              "True / False";

          }

          categories[category].push({
            submission,
            assignment
          });

        }

        Object.keys(categories).forEach(
          category => {

            categories[category].sort(
              (a, b) => {

                const aDate =
                  a.submission.submittedAt
                    ?.toMillis?.() || 0;

                const bDate =
                  b.submission.submittedAt
                    ?.toMillis?.() || 0;

                return bDate - aDate;

              }
            );

          }
        );

        let html = "";

        for (
          const [category, items]
          of Object.entries(categories)
        ) {

          html += `
            <div class="category">

              <h3 class="category-title">
                ${category}
              </h3>
          `;

          if (!items.length) {

            html += `
              <div class="card">
                <p class="muted">
                  No grades in this category yet.
                </p>
              </div>
            `;

          } else {

            html += items.map(
              item => {

                const submission =
                  item.submission;

                const percentage =
                  submission.percentage ??
                  "—";

                const letter =
                  submission.letterGrade ||
                  "";

                return `
                  <div class="card">

                    <h3>
                      ${escapeHTML(
                        item.assignment.title
                      )}
                    </h3>

                    <p class="muted small">
                      ${escapeHTML(
                        item.assignment.courseName ||
                        ""
                      )}

                      <br>

                      Submitted:
                      ${escapeHTML(
                        formatDate(
                          submission.submittedAt
                        )
                      )}
                    </p>

                    <div class="grade-number">

                      ${escapeHTML(
                        percentage
                      )}%

                      ${
                        letter
                          ? `
                            <span class="letter">
                              •
                              ${escapeHTML(letter)}
                            </span>
                          `
                          : ""
                      }

                    </div>

                    <div class="assignment-actions">

                      <button
                        class="button"
                        data-student-review="${submission.id}"
                      >
                        Review Submission
                      </button>

                    </div>

                  </div>
                `;

              }
            ).join("");

          }

          html += `
            </div>
          `;

        }

        container.innerHTML = html;

        container
          .querySelectorAll(
            "[data-student-review]"
          )
          .forEach(button => {

            button.addEventListener(
              "click",
              () =>
                openStudentGradeReview(
                  button.dataset.studentReview
                )
            );

          });

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="card">
            <p class="muted">
              Unable to load your Grade Book.
            </p>
          </div>
        `;

      }

    }

    // ============================================================
    // STUDENT GRADE REVIEW
    // ============================================================

    async function openStudentGradeReview(
      submissionId
    ) {

      try {

        const submissionSnap =
          await getDoc(
            doc(
              db,
              "submissions",
              submissionId
            )
          );

        if (!submissionSnap.exists()) {

          showToast(
            "Submission not found."
          );

          return;
        }

        const submission =
          submissionSnap.data();

        // SECURITY CHECK IN THE UI TOO
        if (
          submission.studentId !==
          currentUser.uid
        ) {

          showToast(
            "You cannot view this submission."
          );

          return;
        }

        const assignmentSnap =
          await getDoc(
            doc(
              db,
              "assignments",
              submission.assignmentId
            )
          );

        if (!assignmentSnap.exists()) {

          showToast(
            "Assignment not found."
          );

          return;
        }

        const assignment =
          assignmentSnap.data();

        const results =
          submission.questionResults || [];

        openModal(`
          <div class="modal-header">

            <div>
              <h2>
                ${escapeHTML(
                  assignment.title
                )}
              </h2>

              <p class="muted small">
                Submission Review
              </p>
            </div>

            <button
              class="close-button"
              id="close-student-review"
            >
              ×
            </button>

          </div>

          <div class="grade-summary">

            <div class="grade-summary-main">

              <div>
                <div class="muted small">
                  Final Grade
                </div>

                <div class="percentage-big">
                  ${escapeHTML(
                    submission.percentage ??
                    "—"
                  )}%
                </div>
              </div>

              <div>
                <div class="muted small">
                  Letter Grade
                </div>

                <div class="letter-big">
                  ${escapeHTML(
                    submission.letterGrade ||
                    "—"
                  )}
                </div>
              </div>

            </div>

            ${
              submission.teacherNote
                ? `
                  <div class="note-box">
                    <strong>
                      Teacher Note
                    </strong>

                    <br><br>

                    ${escapeHTML(
                      submission.teacherNote
                    )}
                  </div>
                `
                : ""
            }

          </div>

          <h3>
            Answer Review
          </h3>

          <div>

            ${
              (assignment.questions || [])
                .map((q, index) => {

                  const result =
                    results[index] || {};

                  const answer =
                    submission.answers?.[index] || "";

                  let resultClass =
                    "";

                  let resultText =
                    "Not graded";

                  if (
                    result.correct === true
                  ) {

                    resultClass =
                      "correct";

                    resultText =
                      "Correct";

                  } else if (
                    result.correct === false
                  ) {

                    resultClass =
                      "incorrect";

                    resultText =
                      "Incorrect";

                  }

                  return `
                    <div class="question-display">

                      <h4>
                        ${index + 1}.
                        ${escapeHTML(
                          q.question
                        )}
                      </h4>

                      <span
                        class="status ${resultClass}"
                      >
                        ${resultText}
                      </span>

                      <div
                        class="muted small"
                        style="margin-top:13px;"
                      >
                        Your Answer
                      </div>

                      <div class="student-answer">
                        ${
                          answer
                            ? escapeHTML(
                                answer
                              )
                            : "No answer"
                        }
                      </div>

                      ${
                        q.type === "math"
                          ? `
                            <div
                              class="muted small"
                              style="margin-top:12px;"
                            >

                              A:
                              ${escapeHTML(
                                q.choices?.[0] || ""
                              )}

                              <br>

                              B:
                              ${escapeHTML(
                                q.choices?.[1] || ""
                              )}

                              <br>

                              C:
                              ${escapeHTML(
                                q.choices?.[2] || ""
                              )}

                            </div>
                          `
                          : ""
                      }

                      ${
                        result.note
                          ? `
                            <div class="note-box">
                              <strong>
                                Teacher Note
                              </strong>

                              <br><br>

                              ${escapeHTML(
                                result.note
                              )}
                            </div>
                          `
                          : ""
                      }

                    </div>
                  `;

                }).join("")
            }

          </div>
        `);

        document
          .getElementById(
            "close-student-review"
          )
          .addEventListener(
            "click",
            closeModal
          );

      } catch (error) {

        console.error(error);

        showToast(
          "Unable to open grade review."
        );

      }

    }

    // ============================================================
    // COURSES
    // ============================================================

    async function renderCourses() {

      pageContent.innerHTML = `
        <h2 class="page-title">
          Courses
        </h2>

        <p class="page-subtitle">
          Your Novex courses and assignments.
        </p>

        <div id="courses-container">
          <div class="card">
            <p class="muted">Loading...</p>
          </div>
        </div>
      `;

      const container =
        document.getElementById(
          "courses-container"
        );

      try {

        let assignmentsQuery;

        if (currentRole === "student") {

          assignmentsQuery =
            query(
              collection(db, "assignments"),
              where(
                "assignedTo",
                "array-contains",
                currentUser.uid
              )
            );

        } else if (
          currentRole === "teacher"
        ) {

          assignmentsQuery =
            query(
              collection(db, "assignments"),
              where(
                "teacherId",
                "==",
                currentUser.uid
              )
            );

        } else {

          assignmentsQuery =
            collection(
              db,
              "assignments"
            );

        }

        const snap =
          await getDocs(
            assignmentsQuery
          );

        const courses = {};

        snap.docs.forEach(d => {

          const data = d.data();

          const name =
            data.courseName ||
            "Other";

          if (!courses[name]) {
            courses[name] = 0;
          }

          courses[name]++;

        });

        const names =
          Object.keys(courses)
            .sort();

        if (!names.length) {

          container.innerHTML = `
            <div class="card empty">

              <strong>
                No courses yet
              </strong>

              Courses will appear here
              when assignments are available.

            </div>
          `;

          return;
        }

        container.innerHTML =
          names.map(
            name => `

              <div class="card">

                <h3>
                  ${escapeHTML(name)}
                </h3>

                <p class="muted">
                  ${courses[name]}
                  assignment${
                    courses[name] === 1
                      ? ""
                      : "s"
                  }
                </p>

              </div>

            `
          ).join("");

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="card">
            <p class="muted">
              Unable to load courses.
            </p>
          </div>
        `;

      }

    }

    // ============================================================
    // ACCOUNT
    // ============================================================

    function renderAccount() {

      pageContent.innerHTML = `

        <h2 class="page-title">
          Account
        </h2>

        <p class="page-subtitle">
          Your Novex account.
        </p>

        <div class="card">

          <h3>
            ${escapeHTML(
              currentProfile?.name ||
              "User"
            )}
          </h3>

          <p
            class="muted"
            style="margin-top:6px;"
          >
            ${escapeHTML(
              currentUser.email || ""
            )}
          </p>

          <div
            class="status graded"
            style="margin-top:15px;"
          >
            ${escapeHTML(currentRole)}
          </div>

        </div>

        <div class="card">

          <h3>
            Sign out
          </h3>

          <p class="muted">
            Sign out of your Novex account on this device.
          </p>

          <button
            class="button danger"
            id="logout-button"
            style="margin-top:17px;"
          >
            Log Out
          </button>

        </div>

      `;

      document
        .getElementById("logout-button")
        .addEventListener(
          "click",
          async () => {

            try {

              await signOut(auth);

              window.location.href =
                "index.html";

            } catch (error) {

              console.error(error);

              showToast(
                "Unable to log out."
              );

            }

          }
        );

    }

  </script>
